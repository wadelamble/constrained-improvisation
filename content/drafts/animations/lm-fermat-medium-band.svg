<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <rect width="1000" height="560" fill="#fbfaf7"/>

  <rect x="70" y="70" width="860" height="420" fill="#ffffff" stroke="#d1c8ba" stroke-width="2"/>
  <rect x="70" y="220" width="860" height="140" fill="#dcecf2" stroke="#89aab7" stroke-width="2"/>
  <text x="90" y="125" font-family="Arial, sans-serif" font-size="22" fill="#4b463f">outside medium, speed v₁</text>
  <text x="90" y="302" font-family="Arial, sans-serif" font-size="22" fill="#335766">slower medium band, speed v₂</text>
  <text x="90" y="438" font-family="Arial, sans-serif" font-size="22" fill="#4b463f">outside medium, speed v₁</text>

  <line x1="330" y1="160" x2="330" y2="280" stroke="#8c8378" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="660" y1="300" x2="660" y2="420" stroke="#8c8378" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="342" y="202" font-family="Arial, sans-serif" font-size="18" fill="#6d665d">normal</text>
  <text x="672" y="344" font-family="Arial, sans-serif" font-size="18" fill="#6d665d">normal</text>

  <polyline points="150,140 330,220 660,360 850,430"
            fill="none" stroke="#245e91" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="150,140 390,220 610,360 850,430"
            fill="none" stroke="#b7ada0" stroke-width="4" stroke-dasharray="9 10" opacity="0.65"/>

  <circle cx="150" cy="140" r="12" fill="#2f2f2f" stroke="#ffffff" stroke-width="3"/>
  <circle cx="330" cy="220" r="12" fill="#2f2f2f" stroke="#ffffff" stroke-width="3"/>
  <circle cx="660" cy="360" r="12" fill="#2f2f2f" stroke="#ffffff" stroke-width="3"/>
  <circle cx="850" cy="430" r="12" fill="#2f2f2f" stroke="#ffffff" stroke-width="3"/>

  <text x="126" y="116" font-family="Arial, sans-serif" font-size="26" fill="#2f2f2f" font-weight="700">A</text>
  <text x="340" y="214" font-family="Arial, sans-serif" font-size="26" fill="#2f2f2f" font-weight="700">B</text>
  <text x="670" y="354" font-family="Arial, sans-serif" font-size="26" fill="#2f2f2f" font-weight="700">C</text>
  <text x="864" y="436" font-family="Arial, sans-serif" font-size="26" fill="#2f2f2f" font-weight="700">D</text>

  <path d="M 330 178 A 42 42 0 0 0 294 199" fill="none" stroke="#245e91" stroke-width="3"/>
  <path d="M 330 262 A 42 42 0 0 0 372 238" fill="none" stroke="#245e91" stroke-width="3"/>
  <text x="255" y="188" font-family="Arial, sans-serif" font-size="21" fill="#245e91">θ₁</text>
  <text x="370" y="265" font-family="Arial, sans-serif" font-size="21" fill="#245e91">θ₂</text>

  <path d="M 660 318 A 42 42 0 0 0 620 340" fill="none" stroke="#245e91" stroke-width="3"/>
  <path d="M 660 402 A 42 42 0 0 0 700 383" fill="none" stroke="#245e91" stroke-width="3"/>
  <text x="612" y="325" font-family="Arial, sans-serif" font-size="21" fill="#245e91">θ₂</text>
  <text x="707" y="403" font-family="Arial, sans-serif" font-size="21" fill="#245e91">θ₁</text>

  <text x="500" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#3f3a34" font-weight="700">Fermat path through a slower medium</text>
  <text x="500" y="522" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#3f3a34">Snell: sin θ₁ / v₁ = sin θ₂ / v₂</text>
  <text x="500" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#6d665d">the physical path is the stationary-time path from A to D</text>
</svg>
