<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Exact wave number versus exact position</title>
  <desc id="desc">A plane wave occupies all of position space but is a spike at one wave number. A spike at one position has equal Fourier magnitude at every wave number.</desc>
  <rect width="1200" height="680" fill="#fbfaf7"/>

  <style>
    .title { font: 600 27px Arial, sans-serif; fill: #1f2933; }
    .head { font: 600 20px Arial, sans-serif; fill: #1f2933; }
    .label { font: 17px Arial, sans-serif; fill: #334155; }
    .small { font: 15px Arial, sans-serif; fill: #5f6b76; }
    .formula { font: italic 18px Georgia, serif; fill: #1f2933; }
    .axis { stroke: #7b8794; stroke-width: 1.6; }
    .divider { stroke: #d7dce1; stroke-width: 1.5; }
    .wave { fill: none; stroke: #286b9b; stroke-width: 4; stroke-linecap: round; }
    .spectrum { fill: none; stroke: #c2642d; stroke-width: 5; stroke-linecap: round; }
    .guide { stroke: #c2642d; stroke-width: 1.5; stroke-dasharray: 6 6; }
  </style>

  <text x="600" y="42" text-anchor="middle" class="title">Localization trades position width for wave-number width</text>
  <text x="320" y="82" text-anchor="middle" class="head">Position representation</text>
  <text x="885" y="82" text-anchor="middle" class="head">Wave-number representation</text>

  <line x1="600" y1="60" x2="600" y2="620" class="divider"/>
  <line x1="42" y1="340" x2="1158" y2="340" class="divider"/>

  <text x="56" y="116" class="head">Exact wave number</text>
  <text x="56" y="143" class="formula">Re ψ(x) = cos(k₀x)</text>

  <line x1="70" y1="220" x2="552" y2="220" class="axis"/>
  <line x1="90" y1="130" x2="90" y2="295" class="axis"/>
  <text x="552" y="244" text-anchor="end" class="small">x</text>
  <path class="wave" d="M90 220 C105 170 120 170 135 220 S165 270 180 220 S210 170 225 220 S255 270 270 220 S300 170 315 220 S345 270 360 220 S390 170 405 220 S435 270 450 220 S480 170 495 220 S525 270 540 220"/>
  <text x="320" y="302" text-anchor="middle" class="label">|ψ| is uniform: no preferred position</text>

  <line x1="650" y1="250" x2="1120" y2="250" class="axis"/>
  <line x1="680" y1="132" x2="680" y2="278" class="axis"/>
  <text x="1115" y="274" text-anchor="end" class="small">k</text>
  <line x1="888" y1="142" x2="888" y2="250" class="spectrum"/>
  <line x1="888" y1="250" x2="888" y2="285" class="guide"/>
  <text x="888" y="306" text-anchor="middle" class="small">k₀</text>
  <text x="885" y="116" text-anchor="middle" class="formula">ψ̃(k) ∝ δ(k − k₀)</text>
  <text x="885" y="330" text-anchor="middle" class="label">Δk = 0, while Δx → ∞</text>

  <text x="56" y="386" class="head">Exact position</text>
  <text x="56" y="413" class="formula">ψ(x) = δ(x − x₀)</text>

  <line x1="70" y1="520" x2="552" y2="520" class="axis"/>
  <line x1="90" y1="412" x2="90" y2="560" class="axis"/>
  <text x="552" y="544" text-anchor="end" class="small">x</text>
  <line x1="322" y1="412" x2="322" y2="520" class="wave"/>
  <line x1="322" y1="520" x2="322" y2="565" class="guide"/>
  <text x="322" y="588" text-anchor="middle" class="small">x₀</text>
  <text x="320" y="620" text-anchor="middle" class="label">all the weight is localized at one position</text>

  <line x1="650" y1="520" x2="1120" y2="520" class="axis"/>
  <line x1="680" y1="410" x2="680" y2="560" class="axis"/>
  <text x="1115" y="544" text-anchor="end" class="small">k</text>
  <line x1="680" y1="435" x2="1110" y2="435" class="spectrum"/>
  <text x="895" y="412" text-anchor="middle" class="formula">|ψ̃(k)| = constant</text>
  <text x="885" y="620" text-anchor="middle" class="label">Δx = 0, while Δk → ∞</text>

  <text x="600" y="660" text-anchor="middle" class="head">Narrowing either representation necessarily broadens its Fourier partner.</text>
</svg>
