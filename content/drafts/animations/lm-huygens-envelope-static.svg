<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#f7f3ec"/>
  <rect x="70" y="60" width="820" height="420" fill="#fbf8f0" stroke="#c9bca8" stroke-width="2"/>
  <rect x="70" y="260" width="820" height="220" fill="#ddeef2"/>
  <line x1="70" y1="260" x2="890" y2="260" stroke="#7d8d91" stroke-width="3"/>

  <text x="95" y="105" font-family="Arial, sans-serif" font-size="22" fill="#4b463f">medium 1, faster wavelets</text>
  <text x="95" y="450" font-family="Arial, sans-serif" font-size="22" fill="#4b463f">medium 2, slower wavelets</text>
  <text x="735" y="244" font-family="Arial, sans-serif" font-size="18" fill="#687679">interface</text>

  <line x1="255" y1="80" x2="600" y2="210" stroke="#2e5f91" stroke-width="4" opacity="0.5"/>
  <line x1="225" y1="130" x2="570" y2="260" stroke="#2e5f91" stroke-width="7" stroke-linecap="round"/>
  <line x1="195" y1="180" x2="540" y2="310" stroke="#2e5f91" stroke-width="4" opacity="0.5"/>
  <text x="255" y="155" font-family="Arial, sans-serif" font-size="20" fill="#2e5f91">incoming wavefront</text>

  <circle cx="360" cy="260" r="92" fill="none" stroke="#b85c38" stroke-width="4" opacity="0.85"/>
  <circle cx="470" cy="260" r="64" fill="none" stroke="#b85c38" stroke-width="4" opacity="0.85"/>
  <circle cx="580" cy="260" r="36" fill="none" stroke="#b85c38" stroke-width="4" opacity="0.85"/>
  <circle cx="690" cy="260" r="8" fill="none" stroke="#b85c38" stroke-width="4" opacity="0.85"/>

  <circle cx="360" cy="260" r="7" fill="#2f2f2f"/>
  <circle cx="470" cy="260" r="7" fill="#2f2f2f"/>
  <circle cx="580" cy="260" r="7" fill="#2f2f2f"/>
  <circle cx="690" cy="260" r="7" fill="#2f2f2f"/>

  <line x1="336" y1="349" x2="703" y2="270" stroke="#783f8e" stroke-width="7" stroke-linecap="round"/>
  <line x1="505" y1="240" x2="575" y2="470" stroke="#783f8e" stroke-width="4" stroke-linecap="round"/>
  <polygon points="575,470 557,446 585,438" fill="#783f8e"/>

  <text x="600" y="365" font-family="Arial, sans-serif" font-size="22" fill="#783f8e">new wavefront envelope</text>
  <text x="590" y="435" font-family="Arial, sans-serif" font-size="22" fill="#783f8e">ray</text>
  <text x="300" y="395" font-family="Arial, sans-serif" font-size="20" fill="#b85c38">secondary wavelets</text>
  <text x="370" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#4b463f">earlier hit points get more time to expand</text>
  <text x="735" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#4b463f">slower medium gives smaller circles</text>
